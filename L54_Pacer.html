          "Identify the variable to isolate → undo outer ops LAST-IN FIRST-OUT → raise to reciprocal power → simplify.",
          "To undo x^(m/n): raise both sides to (n/m).",
          "COMPLETING A TABLE: use rewritten formula as the rule for each row; substitute V-value; calculator for irrational outputs; round as directed.",
          "Assessment Item 2 expects THIS process — rewritten formula → table."
        ],
        bridge:"Topic 5 Performance Assessment rehearsal complete: Item 1A = isolate x (#10 done ✔), Item 2 = complete the table (#44 done in Launch ✔). You own 2 of 3 performance assessment items.",
      },
      { id:"exit", title:"Exit Ticket — Pre-Assessment Confidence Check",
        fw:"confidence check", dok:"1-2", min:3,
        items:[],
        teacher:["Collect at door.","Tonight: scan for students who can't complete the reciprocal-power step or the table row. Insert a 5-min Do Now recap when the Performance Assessment lands."],
        rules:[
          "To isolate a variable from a rational-exponent formula I ___.",
          "When I evaluate the formula at a specific x, I ___.",
          "One biggest thing I learned today: ___"
        ],
      },
    ]
  },
};

const panels = document.getElementById("panels");
const tabBar = document.getElementById("tabBar");
document.getElementById("dateLabel").textContent = new Date().toDateString();

function renderPanel(tabId) {
  const data = PACER[tabId];
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.id = "panel-" + tabId;
  panel.innerHTML = `
    <div class="timer-bar">
      <div>
        <div class="phase-title" id="phaseTitle-${tabId}">Select a phase to begin</div>
      </div>
      <div class="countdown" id="timer-${tabId}">--:--</div>
      <div>
        <button onclick="startPhase('${tabId}')" id="startBtn-${tabId}">Start</button>
        <button class="stop" onclick="stopPhase('${tabId}')">Stop</button>
      </div>
    </div>
    <div style="font-size: 0.9rem; color: var(--muted); margin-bottom: 8px;">${data.label}</div>
    ${data.short_note ? `<div style="background:#fffbea; border-left:4px solid var(--gold); padding:10px 14px; border-radius:6px; font-size:0.9rem; margin:12px 0;">⭐ ${data.short_note}</div>` : ""}
    <div class="phase-list" id="chips-${tabId}"></div>
    <div id="phase-card-${tabId}"></div>
  `;
  panels.appendChild(panel);
  const chipBar = panel.querySelector(`#chips-${tabId}`);
  data.phases.forEach((ph, idx) => {
    const chip = document.createElement("button");
    chip.className = "phase-chip";
    chip.textContent = `${idx+1}. ${ph.title.split(" — ")[0]} · ${ph.min}m`;
    chip.onclick = () => selectPhase(tabId, idx);
    chipBar.appendChild(chip);
  });
  selectPhase(tabId, 0);
}

function selectPhase(tabId, idx) {
  const data = PACER[tabId];
  const ph = data.phases[idx];
  const card = document.getElementById(`phase-card-${tabId}`);
  let html = `<div class="phase-card">
    <h2>${ph.title}
      <span class="badges">
        <span class="badge dok">DOK ${ph.dok}</span>
        <span class="badge min">${ph.min} min</span>
        <span class="badge fw">${ph.fw}</span>
      </span>
    </h2>`;
  if (ph.items && ph.items.length) {
    ph.items.forEach(it => {
      let cls = "item";
      if (it.dok3) cls = "item dok3";
      else if (it.assess) cls = "item assess";
      const star = it.dok3 ? '<span class="star">⭐ DOK-3 </span>' :
                    it.assess ? '<span class="star">⭐ ASSESS </span>' : '';
      html += `<div class="${cls}">${star}<strong>${it.label}</strong> <span class="qid">${it.qid}</span>${it.note ? `<div>${it.note}</div>` : ""}</div>`;
    });
  }
  if (ph.teacher && ph.teacher.length) {
    html += `<div class="callout teacher"><span class="label">🎤 Teacher does</span><ul>`;
    ph.teacher.forEach(t => html += `<li>${t}</li>`);
    html += `</ul></div>`;
  }
  if (ph.rules && ph.rules.length) {
    html += `<div class="callout rule"><span class="label">📘 Rules / stems</span><ul>`;
    ph.rules.forEach(r => html += `<li>${r}</li>`);
    html += `</ul></div>`;
  }
  if (ph.answer) {
    html += `<div class="callout answer"><span class="label">✅ Answer key</span>${ph.answer}</div>`;
  }
  if (ph.bridge) {
    html += `<div class="callout bridge"><span class="label">🔗 Bridge</span>${ph.bridge}</div>`;
  }
  if (ph.warn) {
    html += `<div class="callout warn"><span class="label">⚠️ Warning / Note</span>${ph.warn}</div>`;
  }
  html += `</div>`;
  card.innerHTML = html;
  document.querySelectorAll(`#chips-${tabId} .phase-chip`).forEach((c, i) => {
    c.classList.toggle("active", i === idx);
  });
  document.getElementById(`phaseTitle-${tabId}`).textContent = ph.title;
  currentPhase[tabId] = idx;
  stopPhase(tabId);
  document.getElementById(`timer-${tabId}`).textContent =
    `${String(ph.min).padStart(2,'0')}:00`;
}

const timers = {}, currentPhase = {};

function startPhase(tabId) {
  const idx = currentPhase[tabId];
  const ph = PACER[tabId].phases[idx];
  let remaining = ph.min * 60;
  const timerEl = document.getElementById(`timer-${tabId}`);
  clearInterval(timers[tabId]);
  timers[tabId] = setInterval(() => {
    remaining--;
    if (remaining < 0) {
      clearInterval(timers[tabId]);
      timerEl.textContent = "TIME";
      timerEl.style.color = "#ff6b6b";
      if (idx + 1 < PACER[tabId].phases.length) {
        document.querySelectorAll(`#chips-${tabId} .phase-chip`)[idx].classList.add("done");
      }
      return;
    }
    const m = Math.floor(remaining / 60), s = remaining % 60;
    timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    timerEl.style.color = remaining < 60 ? "#ff6b6b" : "#ffffff";
  }, 1000);
}

function stopPhase(tabId) {
  clearInterval(timers[tabId]);
  const idx = currentPhase[tabId];
  if (idx === undefined) return;
  const ph = PACER[tabId].phases[idx];
  const timerEl = document.getElementById(`timer-${tabId}`);
  timerEl.textContent = `${String(ph.min).padStart(2,'0')}:00`;
  timerEl.style.color = "#ffffff";
}

Object.keys(PACER).forEach(renderPanel);
document.querySelector('.panel').classList.add('active');

tabBar.addEventListener("click", e => {
  if (!e.target.matches(".tab")) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  e.target.classList.add("active");
  document.getElementById("panel-" + e.target.dataset.tab).classList.add("active");
});
</script>

</body>
</html>
