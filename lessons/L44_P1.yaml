lesson_id: L44_P1
title: "Adding \\& Subtracting Rational Expressions + Resistance DOK-3 (Q\\#15 Prep)"
label: "Lesson 4-4 \\textperiodcentered\\ Quick"
period: 1
cadence: single_period_quick

objectives:
  - label: Math Objective
    body: >-
      Add and subtract rational expressions with like and unlike denominators;
      identify the LCM of polynomial denominators; simplify results.
  - label: Language Objective
    body: >-
      Explain why adding rational expressions requires common denominators,
      using the word `LCM' and referring to the analogy with fractions.
  - label: Essential Understanding
    body: >-
      Rational expressions behave like rational numbers --- closed under
      addition and subtraction, and requiring a common denominator before
      you can combine them.

framework_header:
  - label: Topic Goals
    body: >-
      Fluency adding/subtracting rational expressions; understanding closure
      under these operations (Topic 4 assessment Q\#15 prep).
  - label: Essential Question
    body: >-
      When you add two rational expressions with different denominators,
      why must you find the LCM first?
  - label: Materials
    body: >-
      Student packet, pencil, calculator. DOK-3 Practice \#32 (electrical
      resistance) is the capstone and rehearses the structural reasoning
      tested on Topic 4 LEHS Q\#15.

# Teacher-only preflight
preflight:
  title: "PRE-FLIGHT --- SINGLE-PERIOD COMPRESSED LESSON + DOK-3 CAPSTONE"
  color: calloutpink
  body: |
    This is a single-period quick treatment of Lesson 4-4. TWO examples are modeled in Launch (deviation from standard Klimsara one-example rule --- adding and subtracting are distinct assessment skills). Release promptly at minute 18.\\
    Today's capstone is Practice \#32 (electrical resistance parallel circuit). Students must (a) recognize that \(1/R_{\text{total}} = 1/R_A + 1/R_B\) is a sum of rational expressions, (b) build a common denominator, (c) form the ratio of two such resistances as a single simplified rational expression. Same structural reasoning as Topic 4 LEHS Q\#15.\\
    Pace: Try-It 3 (4 min) \(\rightarrow\) Try-It 4 (4 min) \(\rightarrow\) \#12 (3 min) \(\rightarrow\) \#16 (4 min) \(\rightarrow\) \#26 (5 min) \(\rightarrow\) \#32 (10 min). \(\sim\)30 min total Explore (2 min buffer for transitions).\\
    45-min Wed F variant: cut \#16 + \#26. Never cut \#32.

phases:
  do_now:
    framework_tag: "bridge from 4-3 to adding rational expressions"
    dok: "1"
    minutes: 5
    teacher_does:
      - "Hand out at door."
      - "Circulate 3 min."
      - "Cold-call 1 student on the \\(1/2 + 1/3\\) conflict resolution."
    students_do:
      - "Read conflict and decide which student's method is correct."
      - "Justify with the word `common denominator'."
    questions_to_ask:
      - "What's the LCM of 2 and 3?"
      - "Why can't you add \\(1/2 + 1/3\\) by adding numerators and denominators?"
    adult_role: "Solo teacher: circulate silently. No hints."
  launch:
    framework_tag: "teacher models Example 3 + Example 4 [COMPRESSED --- 2 examples]"
    dok: "1--2"
    minutes: 13
    teacher_does:
      - "Project Example 3 (add unlike denominators). Think aloud: factor each denominator, identify LCM, rewrite each fraction."
      - "\"The LCM takes every distinct factor at its highest power.\""
      - "Transition to Example 4 without stopping --- announce: \"Subtracting looks identical UNTIL the distribute step. Watch the minus sign.\""
      - "Project Example 4. Think aloud: after combining numerators, distribute the negative across EVERY term."
      - "Flag the Rules card --- students copy into margin."
      - "30-sec pause: \"Turn to partner: where does the minus sign trap catch students? What do you do to avoid it?\""
      - "Do NOT solve Try-Its or Practice items --- release at minute 18."
    students_do:
      - "Watch Example 3 silently. Note the LCM-building procedure."
      - "Watch Example 4. Mark the sign-distribution step."
      - "During pause: explain sign trap to partner using Rule 2(d)."
      - "Copy Rules card into margin."
    questions_to_ask:
      - "What's the LCM of \\((x-2)\\) and \\((x+3)\\)?"
      - "How do we rewrite \\(5/(x-2)\\) so it has denominator \\((x-2)(x+3)\\)?"
      - "When we subtract, where does the minus sign apply --- to the first term only, or every term of the second numerator?"
      - "After combining, what's the LAST thing you check before you finish?"
    adult_role: "Project both examples back-to-back. Release promptly at minute 18."
  explore:
    framework_tag: "TPS + DOK-3 driver"
    dok: "2--3"
    minutes: 32
    teacher_does:
      - "5 laps across 32 min."
      - "Lap 1 (4 min): Try-It 3 --- add unlike. Press pairs on LCM construction."
      - "Lap 2 (4 min): Try-It 4 --- subtract unlike. Watch for sign-distribution errors."
      - "Lap 3 (3 min): \\#12 --- like denominators (quick confidence build)."
      - "Lap 4 (4+5 min): \\#16 + \\#26. \\#26 is the sign-trap item --- press \"where does the minus go?\" on every pair."
      - "Lap 5 (10 min): \\IconStar\\ \\#32 Electrical Resistance. Students build common denominators for reciprocal sums, then form the ratio."
      - "Do NOT give \\#32 CER answers. Pairs present argument at Share."
    students_do:
      - "6 items in order: Try-It 3 \\(\\rightarrow\\) Try-It 4 \\(\\rightarrow\\) \\#12 \\(\\rightarrow\\) \\#16 \\(\\rightarrow\\) \\#26 \\(\\rightarrow\\) \\#32."
      - "For \\#32: BEFORE computing, write out \\(1/R_{\\text{total}} = 1/R_A + 1/R_B\\) for each circuit and identify the LCM."
      - "Justify the ratio form with sentence frame."
    questions_to_ask:
      - "Try-It 3: what's the LCM of the two denominators?"
      - "Try-It 4: where does the minus sign distribute?"
      - "\\#12: like denominators --- what's the one step you can skip compared to unlike?"
      - "\\#16: factor both denominators first. Now what's the LCM?"
      - "\\#26: watch the subtraction. Where do students typically lose the sign?"
      - "\\#32: what's the LCM for \\(1/R_1 + 1/R_2\\)? How do you flip to get \\(R_{\\text{total}}\\)?"
      - "\\#32: how do you form the ratio \\(R_A/R_B\\) as a SINGLE simplified rational expression?"
    adult_role: >-
      Solo teacher: 5 laps. On \#32, press the LCM-of-reciprocals move and
      the final single-expression form --- those are the assessment-critical moves.
  share_summary:
    framework_tag: "academic conversation + Topic 4 LEHS Q\\#15 bridge"
    dok: "2"
    minutes: 5
    teacher_does:
      - "Cold-call 1 pair to present their resistance solution using sentence frame."
      - "Class signals thumbs. Write the LCM step on board."
      - "Topic 4 bridge: \"This is the structural reasoning on Topic 4 LEHS Q\\#15. You have now rehearsed it.\""
    students_do:
      - "Presenting pair reads their solution and cites the LCM step."
      - "Rest of class signals and writes takeaway in margin."
    questions_to_ask:
      - "Summarize: how did you get from \\(1/R_1 + 1/R_2\\) to a single rational expression?"
      - "Why does the ratio simplify the way it does?"
    adult_role: "Cold-call a pair that struggled on \\#32 --- hold them accountable to the LCM step."
  exit:
    framework_tag: "summary recap (not graded)"
    dok: "1--2"
    minutes: 3
    teacher_does:
      - "Collect at door."
      - "Scan stem 2 (reciprocal-sum connection). Plan re-teach if many students can't explain the parallel to adding rational expressions."
    students_do:
      - "3 sentence stems, honest."
    questions_to_ask:
      - "Did students connect LCM to the addition procedure?"
      - "Did students recognize the structural parallel between parallel circuits and rational-expression addition?"
    adult_role: "Collect. No grade."

