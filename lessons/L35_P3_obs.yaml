  reinforcement: []

# Section-anchored callouts extracted from teacher tex
callouts:
  - section: launch
    title: "TOUCH / CROSS RULE"
    color: calloutgreen
    teacher_only: true
    body: |
      Even multiplicity (squared factor, etc.) $\rightarrow$ graph \textbf{touches} the $x$-axis and turns back.\\
      Odd multiplicity (factor to the first, third, etc. power) $\rightarrow$ graph \textbf{crosses} through the $x$-axis.\\
      End behavior: check degree parity and leading-coefficient sign (positive $\rightarrow$ up-right; negative $\rightarrow$ down-right).
  - section: explore
    title: "MYSTERY GRAPH TASK"
    color: calloutpink
    teacher_only: false
    body: |
      Zeros at $x = -1$ (touch) and $x = 3$ (cross). Both ends point \textbf{downward}.\\
      Build a possible factored form. Justify every piece --- the factors, their powers, and the leading coefficient.\\
      \textit{Note: this graph has more than two labeled zeros. Focus on what the two labeled zeros tell you and what ends-down behavior tells you about leading coefficient and degree.}

sentence_frames:
  section: launch
  frames:
    - "\"The factor for $x = $ ___ must be ___ because the graph ___.\""
    - "\"The leading coefficient is ___ because the ends go ___.\""
    - "\"I notice ___, so I think ___.\""

exit_ticket:
  title: "EXIT TICKET — DOK-1 Cool-Down"
  items:
    - "A factor of $(x-4)^2$ produces a ___ at $x = 4$. (touch / cross)"
    - "A factor of $(x+1)$ produces a ___ at $x = -1$. (touch / cross)"
    - "The biggest thing I learned today was: \\dotfill"

