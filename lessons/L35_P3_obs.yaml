# Lesson 3-5 · Day 3 (Observation, 5/8/26 Period F) — back-extracted yaml.
#
# This yaml is METADATA, not a generator input. The canonical source for the
# tex is the hand-authored tex file (build_lesson_from_yaml.py is NOT run on
# this lesson). The yaml exists so the lessons table, schedule, web app, and
# any future tooling can read lesson STRUCTURE (objectives, items, phases)
# without parsing latex.

lesson_id: L35_P3_obs
title: "Multiplicity & Factored-Form Graphing — DOK-3 Mystery Graph (Observation Lesson)"
label: "Lesson 3-5 · Day 3 (Observation)"
period: 3
cadence: full_three_period
day_of_cadence: 3   # P3 = 3rd of the 3-period cadence; semantic is decoupled from calendar drift
topic: "3-5"

objectives:
  - label: Math Objective
    body: >-
      Construct a factored polynomial from a graph by identifying
      x-intercepts, choosing the correct multiplicity at each
      (touch = even, cross = odd), and applying end behavior to
      determine the leading coefficient sign.
  - label: Language Objective
    body: >-
      Students will use the frame "The factor for x = ___ must be ___
      because the graph ___" to justify each factor of a polynomial,
      and explain why even multiplicity produces a touch while odd
      multiplicity produces a cross.
  - label: Essential Understanding
    body: >-
      A polynomial's graph and its factored form encode the same
      information — zeros locate the factors, multiplicity determines
      the local behavior at each x-intercept (touch vs. cross), and end
      behavior determines the leading coefficient sign.

framework_header:
  - label: Topic Goals
    body: >-
      Multiplicity is the bridge between symbolic factored form and graph
      behavior. Students who own this connection can later read rational
      functions, exponential models, and trig graphs structurally rather
      than by memorization.
  - label: Essential Question
    body: >-
      How do zeros, multiplicity, and end behavior together determine a
      polynomial's factored form?
  - label: Materials
    body: "Pencils; student packet; calculator; coordinate grids on the Mystery Graph page. No Chromebooks required."

# Teacher-only preflight at top of teacher body
preflight:
  title: "PRE-FLIGHT — OBSERVATION DAY: DOK-3 MYSTERY GRAPH SPINE"
  color: calloutpink
  body: |
    DOK arc for the day: gradual-release Launch (I-do \(\rightarrow\) you-do \(\rightarrow\) I-check \(\rightarrow\) we-do-together) gives students a worked example to lean on, THEN the DOK-3 Mystery Graph hits in Explore, then DOK-2 consolidation, then a DOK-1 cool-down at Exit. The DOK-3 task is loaded near the front of Explore (not buried at the end) so the reasoning happens while energy is high.\\
    Standards: HSA.APR.B.3, HSF.IF.C.7.C. SMPs 1, 3, 7.\\
    Formative: TPS check-ins during Launch and Explore (4--6 circulation laps); exit ticket (vocabulary + 1 quick reverse-engineer).

# Framework phase headers
phases:
  do_now:
    framework_tag: "Quick recall — NOT the DOK-3 hook"
    dok: "1"
    minutes: 5
    teacher_does:
      - "Project 3 factored polynomials; ask students to list zeros (no graphing yet)."
      - "Adult role: spot-check; flag \\#2 (the squared factor) for the Launch hook."
    students_do:
      - "Read each polynomial; list zeros; circle anything unusual."
    questions_to_ask:
      - "How can you engage students in the lesson?"
      - "How are all adults intentionally planned for?"
    adult_role: >-
      Spot-check circulating; flag item 2 (squared factor) for the Launch hook.
    student_activity: >-
      Students read three factored polynomials and list zeros; circle the squared factor in item 2.

  launch:
    framework_tag: "Gradual release (I-do → you-do → I-check → we-do-together)"
    dok: "1-2"
    minutes: 15
    teacher_does:
      - "I do (4 min): Project f(x) = (x-2)^2(x+3). Think aloud while sketching; name touch/cross rule explicitly on the board."
      - "You do (4 min): Project g(x) = (x+1)(x-4)^2. Students sketch independently in packet."
      - "I check (3 min): Circulate; pull two student sketches (one correct, one with touch/cross error); name misconception out loud."
      - "We do together (4 min): Project h(x) = -x(x+2)^2(x-1). Whole-class call-and-response on zeros, touch/cross, and end behavior."
      - "Read content and language objectives aloud at the end."
    students_do:
      - "I do: Watch and annotate example in packet; copy the touch/cross rule."
      - "You do: Independently sketch g(x) = (x+1)(x-4)^2 using the rule."
      - "I check: Compare with projected exemplar; revise; participate in misconception fix."
      - "We do together: Call out answers chorally for harder example; copy the final sketch."
    questions_to_ask:
      - "What will you explicitly model and how?"
      - "How will you know if students are ready to work alone?"
      - "How are all adults intentionally planned for?"
    adult_role: >-
      Model precisely in I-do; circulate aggressively in You-do; name errors without judgment
      in I-check; conduct We-do as a chorus.
    student_activity: >-
      Gradual release from annotating a modeled example to independent sketching to whole-class
      call-and-response. Students copy the touch/cross rule and apply it to three polynomial functions.

  explore:
    framework_tag: "DOK-3 task (front-loaded), then DOK-2 consolidation"
    dok: "2-3"
    minutes: 25
    teacher_does:
      - "Mystery Graph (10 min, TPS): Project graph with zeros at x=-1 (touch), x=3 (cross), ends both down. Pose: 'Build a possible factored form; justify every piece.'"
      - "Start TPS: 3 min independent, 3 min partner share, 4 min whole-group."
      - "Circulate; tag 2-3 different responses. In whole-group press on leading coefficient sign and degree."
      - "DOK-2 consolidation (15 min, TPS): 3 practice items — factored→graph, factored→graph with multiplicity-3 factor, graph→factored."
      - "4-6 circulation laps; pull struggling pair to re-teach huddle if needed; tag exemplars for Share."
    students_do:
      - "Mystery Graph: TPS — propose a factored form; defend each factor and leading coefficient using the sentence frame."
      - "DOK-2 items: Work in pairs; record reasoning, not just answers; verify with Desmos at end of each item."
    questions_to_ask:
      - "Where does the graph touch vs. cross? Why?"
      - "What does end behavior tell you about degree and sign?"
      - "How would you check your factored form is right?"
      - "Why must the leading coefficient be negative?"
      - "Could the degree be 4 instead of 3? What would change?"
    adult_role: >-
      4-6 circulation laps; press pairs on Mystery Graph leading-coefficient reasoning; pull a
      struggling pair to a re-teach huddle if needed; tag exemplars for Share.
    student_activity: >-
      DOK-3 Mystery Graph TPS (reverse-engineer a factored polynomial from a graph), followed by
      three DOK-2 graph-factored-form practice items worked with a partner.

  share_summary:
    framework_tag: "Synthesis — return to objectives, name the rule again"
    dok: "1-2"
    minutes: 5
    teacher_does:
      - "Re-state the multiplicity rule using student language from Launch."
      - "Press: 'Where in today's items did the rule save you time?'"
      - "Project objectives. Ask: 'Which one did you hit? Where did you struggle?'"
    students_do:
      - "Share one item where the rule helped; agree/disagree/add on; reflect on objectives."
    questions_to_ask:
      - "How will students express what they have learned?"
    adult_role: >-
      Cold-call a pair that used the sentence frame correctly during Mystery Graph;
      hold the class accountable to naming the touch/cross distinction explicitly.
    student_activity: >-
      Students write today's rule in their own words and identify one item where the rule
      helped them; whole-class synthesis via sentence frames.

  exit:
    framework_tag: "DOK-1 cool-down (vocabulary + 1 sentence)"
    dok: "1"
    minutes: 5
    teacher_does:
      - "Project exit prompt (low-stakes by design): two fill-in-the-blank touch/cross items plus one open sentence."
      - "Collect at door."
      - "Review before P3 (Storage Box) on Mon 5/11."
    students_do:
      - "Complete exit ticket independently; turn in on the way out."
    questions_to_ask:
      - "How will students show what they've learned based on the objective?"
    adult_role: >-
      Collect at door. No grade. Scan item 3 (biggest thing learned) to plan 5/11 Do Now bridge.
    student_activity: >-
      Two vocabulary fill-ins (touch vs cross) and one open reflection sentence completed independently.

