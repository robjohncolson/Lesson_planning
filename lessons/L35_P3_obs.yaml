      \textbullet\ Pair ELL students with English-dominant partners for TPS.
  - title: "OBSERVATION CONTEXT (5/8/26, Period F)"
    color: calloutpeach
    body: |
      This is the 5/8/26 Period F observation lesson. Evaluator focus: gradual-release fidelity in Launch and DOK-3 productive struggle in Explore. The Mystery Graph task is intentionally front-loaded in Explore so the highest-cognitive-demand work happens while student energy is high. Exit ticket is deliberately DOK-1 (cool-down, not assessment).\\
      Next class (Mon 5/11): Storage Box DOK-3 (L35 P3 content — real+complex zeros and modeling).
