# Section-anchored callouts (rendered in both editions unless teacher_only)
callouts:
  - section: launch
    title: "\\IconBook\\ APPLICATION RULES (keep printed on your page)"
    color: calloutgreen
    body: |
      \textbullet\ To model an inverse variation in context:
      \begin{enumerate}[leftmargin=2.1em,itemsep=1pt,topsep=3pt]
        \item Identify the two varying quantities and their constant product \(k\).
        \item Compute \(k\) from one given pair: \(k =\) (quantity 1) \(\times\) (quantity 2).
        \item Write the equation: \(y = k/x\) (or rename variables to fit the context).
        \item Solve for the unknown quantity.
      \end{enumerate}
      \textbullet\ Example (Savvas Ex 3, bouzouki): string length \(s\) varies inversely with frequency \(f\).\\
      \hspace*{1.6em}26-inch string \(\rightarrow\) 329.63 cycles/sec \(\rightarrow\) \(k = 26 \times 329.63 = 8{,}570.38\).\\
      \hspace*{1.6em}New length 13 inches \(\rightarrow\) \(f = 8{,}570.38 / 13 = 659.26\) cycles/sec.
  - section: launch
    title: "\\IconWarn\\ DIRECT vs INVERSE (both appear in today's DOK-3!)"
    color: calloutred
    body: |
      DIRECT: \(y = kx\) \(\rightarrow\) \(y/x\) is constant. As \(x\) increases, \(y\) INCREASES proportionally.\\
      INVERSE: \(y = k/x\) (\(xy = k\)). As \(x\) increases, \(y\) DECREASES proportionally.\\
      Test: compute \(y/x\) (direct) AND \(xy\) (inverse). Whichever is constant tells you the relationship.
  - section: share_summary
    title: "\\IconSearch\\ BRIDGE TO P3 (Wednesday)"
    color: calloutpeach
    body: |
      Tomorrow we graph the RECIPROCAL FUNCTION \(y = 1/x\) and its translations. Watch for: the graph of inverse variation has asymptotes and a specific shape --- a hyperbola. You've been drawing them already; we'll name the features.

sentence_frames:
  section: share_summary
  frames:
    - "Pair share (Ramón task): \"Part A is ___ variation because distance and time have a constant RATIO of ___. Part B is ___ variation because gas and time have a constant PRODUCT of ___.\""
    - "Whole class: one pair reads the contrast. Class signals thumbs up/sideways."

exit_ticket:
  title: "EXIT TICKET --- Summary Recap"
  items:
    - "Today I learned that \\dotfill"
    - "The biggest trap in Ramón's task was \\dotfill"
    - "I distinguish direct from inverse variation by \\dotfill"

# Teacher-only trailing callouts (period variants, accommodations)
teacher_callouts:
  - title: "\\IconClock\\ PERIOD A / PERIOD F --- 65-MIN CLASS NOTES"
    color: calloutpink
    body: |
      Both sections should have 65 min for P2. Use the extra 10 min on Explore \#26 (Ramón) --- the richer discussion, the better the DOK-3 payoff.\\
      If finished early: hand out Practice \#25 (SAT/ACT MC) as fast-finisher.
  - title: "\\IconPuzzle\\ MODIFICATIONS / SUPPORT FOR IEP STUDENTS"
    color: calloutiep
    body: |
      \textbullet\ Provide the Application Rules card as a sticker/cut-out.\\
      \textbullet\ For \#26, provide pre-formatted work space: "PART A: distance = ___ × time" etc.\\
      \textbullet\ Accept verbal sentence-frame completion in lieu of written.
  - title: "\\IconGlobe\\ SUPPORTS FOR ELL STUDENTS"
    color: calloutell
    body: |
      \textbullet\ Sentence frames on student page (don't skip).\\
      \textbullet\ Word cards: "frequency" = how often; "volume" = space inside; "pressure" = push.\\
      \textbullet\ "Performance Task" = an assessment task with multiple parts.\\
      \textbullet\ Pair ELL students with English-dominant partners for TPS.

# Chain callbacks (teacher-only, anchored to specific item)
chain_callbacks:
  - chain: 1
    anchor_item: "4-1-savvas-q17"
    title: "Wavelength/Frequency (first callback)"
    body: |
      \textit{When to say:} Before students start Practice \#17.

      \smallskip
      ``Remember Storage Box? We had a volume constraint, we wanted a dimension. Here we have a \textbf{product constraint} --- wavelength times frequency equals the speed of light --- and we still want to pull out one side given the other. Different equation, same job.''

      \smallskip
      \textit{Secondary plant:} this is where inverse variation becomes the thematic bridge between polynomial modeling (Topic 3) and the reciprocal/log families (Topics 4--6). Name it.

# Visual specs — referenced by `visual:` in items above. Rendered as TikZ.
visuals:
  radio_wavelength_graph:
    kind: pgfplot
    xlabel: "Frequency (kilohertz)"
    ylabel: "Wavelength (m)"
    xmin: 0
    xmax: 10000
    ymin: 0
    ymax: 1200
    curve_expression: "300000/x"
    curve_label: "w = \\dfrac{k}{f}"
    curve_domain: [250, 10000]
    data_points: [[1000, 300], [2000, 150], [4000, 75], [6000, 50], [8000, 37.5], [10000, 30]]
  ramon_route_diagram:
    kind: tikz_boxes
    boxes:
      - {pos: [0, 0], label: "Cleveland, OH", fill: frameshade}
      - {pos: [5.0, 0], label: "Pittsburgh, PA", fill: frameshade}
    arrow: {from: cle, to: pit, label: "133 miles\\\\2 hours"}
    extra:
      - {pos: [2.5, -1.0], label: "After 2 h: 9 gal in tank", fill: calloutyellow}
      - {pos: [2.5, -2.0], label: "Continue for 5 more hours", fill: calloutpeach}
