# Lesson 4-1 · Period 2 — Inverse Variation Applications + DOK-3 Performance Task
#
# This is the first YAML-driven lesson spec (2026-04-22 proof-of-concept).
# `python build_lesson_from_yaml.py lessons/L41_P2.yaml` emits:
#   tex/L41_P2_student.tex + tex/L41_P2_teacher.tex
#
# Schema is documented in build_lesson_from_yaml.py. Item prompts/answers
# come from questionbank/registry.jsonl — this file carries lesson STRUCTURE
# only (phases, callouts, ordering, accommodations), not item content.

lesson_id: L41_P2
title: "Inverse Variation Applications + DOK-3 Performance Task"
label: "Lesson 4-1 · Period 2"
period: 2
cadence: full_three_period   # full_three_period | single_period_quick

objectives:
  - label: Math Objective
    body: >-
      Apply inverse variation to real-world contexts (wavelength, gas
      pressure, travel distance), and distinguish DIRECT variation
      (\(y = kx\)) from INVERSE variation (\(xy = k\)) inside a single
      multi-part problem.
  - label: Language Objective
    body: >-
      Students will use the frame "This is ___ variation because as
      ___ ___, ___ ___ proportionally." to justify whether a relationship
      is direct or inverse.
  - label: Essential Understanding
    body: >-
      Not every covariation is inverse variation. Direct variation has a
      constant RATIO (\(y/x = k\)); inverse variation has a constant
      PRODUCT (\(xy = k\)). A single scenario can contain BOTH types
      across different variable pairs.

framework_header:
  - label: Topic Goals
    body: >-
      Students model 4 contextual inverse-variation problems, then tackle
      a Performance Task (Ramón's road trip) that embeds direct and
      inverse variation in one scenario. Every item is Savvas-sourced.
  - label: Essential Question
    body: >-
      How does inverse variation model real-world relationships, and how
      is it different from direct variation?
  - label: Materials
    body: "Pencils; student packet; calculator. No Chromebooks required."

# Teacher-only preflight at top of teacher body
preflight:
  title: "PRE-FLIGHT --- P2 IS THE DOK-3 SPINE DAY"
  color: calloutpink
  body: |
    Today's conceptual core is Practice \#26 (Ramón). Part A is direct variation, Part B is inverse --- same scenario, different variable pairs. That contrast IS the lesson's deepest content.\\
    Pace: Try-It 3 (5 min) \(\rightarrow\) \#12 (4 min) \(\rightarrow\) \#17 (5 min) \(\rightarrow\) \#23 (7 min) \(\rightarrow\) \#26 (12-15 min). \(\sim\)33-36 min total Explore.\\
    If running tight: cut \#12 (the HOT inverse-square is tangent, not central). Never cut \#26.

# Framework phase headers (teacher-edition only)
phases:
  do_now:
    framework_tag: "bridge from P1"
    dok: "1"
    minutes: 5
    teacher_does:
      - "Hand out at door."
      - "Circulate 3 min."
      - "Cold-call 1 student for \\(xy\\) computation."
    students_do:
      - "Compute \\(xy\\) for each column."
      - "State \\(k\\) if constant; explain if not."
    questions_to_ask:
      - "What do you multiply to check for inverse variation?"
      - "What would make this NOT inverse? (\\(xy\\) not constant.)"
    adult_role: "Solo teacher: circulate, time 5 min, pull sheets."
  launch:
    framework_tag: "model inverse variation in context"
    dok: "2"
    minutes: 12
    teacher_does:
      - "Project Example 3 (bouzouki) and walk through the 4-step rule card."
      - "Compute k = 26 × 329.63 out loud."
    students_do:
      - "Copy the rule card into the margin if helpful."
      - "Solve for the new frequency as the teacher models."
    questions_to_ask:
      - "What TWO quantities are varying inversely here?"
      - "Why does longer string → lower frequency?"
    adult_role: "Teacher models ONE example fully. No side excursions."
  explore:
    framework_tag: "TPS + DOK-3 driver"
    dok: "2-3"
    minutes: 33
    teacher_does:
      - "5 laps circulation (~6 min each)."
      - "Lap 1: Try-It 3. Lap 2: #12. Lap 3: #17. Lap 4: #23. Lap 5: #26."
      - "Do NOT give #26 answers. Pairs present argument at Share."
    students_do:
      - "Work with partner, move in order."
      - "For #26, write direct-vs-inverse classification BEFORE solving."
    questions_to_ask:
      - "#26 Part A: what's constant — the ratio or the product?"
      - "#26 Part B: if time doubles, what happens to the gas remaining?"
    adult_role: "Press pairs on #26 direct-vs-inverse distinction. It IS the DOK-3."
  share_summary:
    framework_tag: "DOK-3 pair presents + Wed bridge"
    dok: "2"
    minutes: 5
    teacher_does:
      - "Cold-call a pair that struggled on #26."
      - "Wed bridge: \"Tomorrow we graph these inverse functions and name the features.\""
    students_do:
      - "Presenting pair uses sentence frame for Parts A and B."
      - "Rest of class signals and writes takeaway in margin."
    questions_to_ask:
      - "Summarize: how do you test direct vs inverse?"
      - "Wednesday preview: what shape do you think y = k/x graphs as?"
    adult_role: "Cold-call a pair that struggled on #26 --- hold them accountable to the distinction."
  exit:
    framework_tag: "summary recap (not graded)"
    dok: "1-2"
    minutes: 3
    teacher_does:
      - "Collect at door."
      - "Scan #3 (how to distinguish direct from inverse). Plan P3 Do Now if many are fuzzy."
    students_do:
      - "3 sentence stems, honest."
    questions_to_ask:
      - "Did students articulate the test (y/x constant = direct; xy constant = inverse)?"
    adult_role: "Collect. No grade."

