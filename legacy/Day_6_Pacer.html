<script>
// ----------------------------------------------------------------------
// Phase definitions — each phase is self-contained. Teacher does NOT
// need the paper packet. Sub-steps give nested timing hints.
// Day 6: Polynomial Inequalities (Savvas-only, DOK 1-2 practice day)
// ----------------------------------------------------------------------
const PHASES = [
  {
    title: "Do Now — Savvas Practice #21 (Bridge)",
    framework: "Do Now A",
    dok: "DOK 1",
    duration: 5 * 60,
    substeps: [
      {label: "Hand out sheets; students start silently", sec: 45},
      {label: "Students solve equation; show work", sec: 210},
      {label: "Scan sheets — note who found complex roots", sec: 45},
    ],
    instructions: `
      <h3>Student task</h3>
      <p><strong>Savvas Practice #21</strong>. Solve −5x⁴ + 4x² − 12x = −6x⁴ + 3x³.
      Find ALL solutions — real AND complex. Show work.</p>

      <div class="callout answer">
        <strong>Answer key:</strong> Move to one side: x⁴ − 3x³ + 4x² − 12x = 0.<br>
        Factor: x(x³ − 3x² + 4x − 12) = x · [x²(x − 3) + 4(x − 3)] = x(x − 3)(x² + 4).<br>
        Real solutions: <strong>x = 0</strong> and <strong>x = 3</strong>.<br>
        Complex solutions: x = 2i and x = −2i (not on the number line).<br>
        <em>Bridge:</em> The real zeros 0 and 3 divide the number line — that's today's key idea.
      </div>

      <h3>Teacher moves (silent)</h3>
      <ul>
        <li>Hand sheets at the door. Walk one lap as students work.</li>
        <li>Scan: students who wrote only x = 0 and x = 3 missed complex roots → cold-call in Launch ("Are complex zeros on the number line? Why not?").</li>
        <li>Students who wrote all four → have them explain the bridge.</li>
      </ul>

      <div class="callout warn"><strong>DOK 1 · 5 min · Silent · Pencil only · No Desmos</strong></div>
    `,
    transition: `When timer hits 0: "Pencils down. Chromebooks out. Blooket code on the next slide."`
  },

  {
    title: "Blooket Login",
    framework: "Do Now B",
    dok: "—",
    duration: 2 * 60,
    instructions: `
      <h3>Teacher action</h3>
      <ul>
        <li>Display Blooket code on the projector (Day 6 Slide 3).</li>
        <li>Load the Day 6 rule-recall CSV (tags: blooket-pool, day6-inequalities).</li>
        <li>Decide mode: <strong>Fishing Frenzy</strong> (first time) or <strong>Racing</strong> (repeat day).</li>
      </ul>

      <div class="callout"><strong>Mode for today:</strong>
        <div class="mode-toggle">
          <button id="mode-fishing" class="on" onclick="setMode('fishing')">Fishing Frenzy</button>
          <button id="mode-racing" onclick="setMode('racing')">Racing</button>
        </div>
        <span id="mode-note" style="font-size:0.85rem; opacity: 0.8; margin-left: 0.5rem;"></span>
      </div>

      <p>Students open Chromebooks, type code, enter nickname. Late joiners hop in mid-game.</p>
    `,
    transition: `"Everyone in? Go."`
  },

  {
    title: "Blooket — Rule Recall",
    framework: "Do Now C",
    dok: "DOK 1",
    duration: 6 * 60,
    // One 6-minute round. No sub-rounds.
    instructions: `
      <h3>Rules under test (also on Slide 4)</h3>
      <ul>
        <li>Zero Product Property  (zero ⇔ factor = 0)</li>
        <li>Sign of f can only change at a zero of <strong>odd</strong> multiplicity</li>
        <li>Even-multiplicity zero = <strong>same sign</strong> on both sides</li>
        <li>Continuous polynomial → sign is constant between zeros</li>
        <li>GCF first; Quadratic Formula if factor doesn't split</li>
        <li>Strict inequality (&lt;, &gt;) → zeros NOT included in solution</li>
      </ul>

      <div class="callout script">
        <strong>Display during play:</strong> project the Day 6 rule-recall slide (Slide 4), not the Blooket leaderboard. Students see the rules they're being tested on.
      </div>

      <h3>Dashboard diagnostic (during play)</h3>
      <p>Note the TWO lowest-percent rules. You'll use them in the Wrap phase.</p>

      <div class="callout warn">
        <strong>6 min hard stop.</strong> Wrap phase is separate — don't let game run over.
      </div>
    `,
    transition: `Close the game. "Pencils up, we're doing the Wrap."`
  },

  {
    title: "Blooket Wrap — Candy + Lowest Rule",
    framework: "Do Now D",
    dok: "DOK 1",
    duration: 1 * 60,
    substeps: [
      {label: "Candy: pass to class; winner(s) get extra", sec: 20},
      {label: "Class repeats the lowest-scored rule aloud", sec: 25},
      {label: "Tight transition into Launch", sec: 15},
    ],
    instructions: `
      <h3>Teacher moves (tight, 60 sec total)</h3>
      <ol>
        <li><strong>Candy pass</strong> (~20 sec): walk the candy jar once. Top finisher(s) get extra. Low-stakes tradition.</li>
        <li><strong>Lowest-scored rule aloud</strong> (~25 sec): announce the lowest-percent rule from the dashboard. Whole class repeats in unison (1 beat); an individual volunteer says it once more. Example: "Sign changes only at zeros of odd multiplicity."</li>
        <li><strong>Transition</strong> (~15 sec): "Pull out your Do Now sheet. We're going to use those zeros right now."</li>
      </ol>

      <div class="callout">
        <strong>Why this works:</strong> verbalizing the weakest rule seats it in memory right before Launch uses it. Sugar bumps engagement.
      </div>
    `,
    transition: `"Pull out your Do Now. 12 minutes on Launch."`
  },

  {
    title: "Launch — Sign-Chart Method (Example 6 / Try It 6a)",
    framework: "Launch",
    dok: "DOK 2",
    duration: 12 * 60,
    substeps: [
      {label: ""Pull out your Do Now." — bridge to number line", sec: 30},
      {label: "Turn-and-Talk: which zeros go on the number line?", sec: 90},
      {label: "Cold-call (low-stakes) — complex zeros not on number line", sec: 60},
      {label: "Partners: Steps 1–2 on Try It 6a (factor + zeros)", sec: 150},
      {label: "Class builds number line together (Steps 3–4)", sec: 120},
      {label: "Partners test intervals + NAME the method", sec: 270},
    ],
    instructions: `
      <h3>Launch script — <strong>class builds the sign chart together; teacher does NOT pre-draw it</strong></h3>
      <p>Walk laps reading student work. For ~10 students / 5 pairs, two laps covers everyone.</p>

      <div class="callout script">
        <strong>Cold-call phrasing (low-stakes):</strong>
        "<em>[Name], which of your Do Now solutions would you plot on a number line?</em>" → sincere "thanks" → "<em>anyone want to build on that?</em>"<br>
        Expected: x = 0 and x = 3 go on the number line; 2i and −2i do not (they're not real).
      </div>

      <h3>Try It 6a target walk-through</h3>
      <div class="callout answer">
        <strong>Solve 2x³ + 12x² + 12x &lt; 0</strong><br>
        <strong>Step 1:</strong> Factor GCF: 2x(x² + 6x + 6) &lt; 0<br>
        <strong>Step 2:</strong> Zeros — x = 0; Quadratic Formula on x² + 6x + 6:<br>
        &nbsp;&nbsp;x = (−6 ± √(36−24)) / 2 = −3 ± √3<br>
        &nbsp;&nbsp;Zeros: x ≈ −4.73, x ≈ −1.27, x = 0<br>
        <strong>Steps 3–4:</strong> Four intervals. Test points:<br>
        &nbsp;&nbsp;x = −5 → 2(−5)(pos) = <strong>NEG</strong> ✓&nbsp;&nbsp;x = −3 → 2(−3)(neg) = POS ✗<br>
        &nbsp;&nbsp;x = −1 → 2(−1)(neg) = POS ✗&nbsp;&nbsp;x = 1 → 2(1)(pos) = POS ✗<br>
        <strong>Solution:</strong> x &lt; −3 − √3 &nbsp;OR&nbsp; −3 + √3 &lt; x &lt; 0
      </div>

      <div class="callout warn">
        <strong>Gotcha 1:</strong> x² + 6x + 6 does NOT factor over integers. Students must use Quadratic Formula. Warn before they stall.<br>
        <strong>Gotcha 2:</strong> x = 0 has multiplicity 1 (odd) → sign CHANGES at x = 0. Don't let students assume it doesn't.
      </div>

      <h3>Savvas TE Questions (use during partner work)</h3>
      <ul>
        <li><em>"Does f(x) change sign between every pair of consecutive zeros?"</em><br>Expected: No — even-multiplicity zeros keep the same sign.</li>
        <li><em>"What does the leading coefficient tell you about sign for very large x?"</em><br>Expected: positive leading coefficient, odd degree → f → +∞ as x → +∞.</li>
        <li><em>Habits of Mind:</em> "If you know the sign in one interval, how does that help you fill in the others?"</li>
      </ul>
    `,
    transition: `"Packets to Practice — 20 minutes. A required; pick two of B/C/D."`
  },

  {
    title: "Practice — Try It 6b + Pick Two of #22/#23/#24",
    framework: "Practice",
    dok: "DOK 2",
    duration: 20 * 60,
    substeps: [
      {label: "Lap 1 — every pair has A started; zeros plotted", sec: 300},
      {label: "Lap 2 — pairs choosing and setting up B/C/D", sec: 300},
      {label: "Lap 3 — pairs on their second item; check sign chart", sec: 300},
      {label: "Lap 4 — fast finishers extend; stuck pairs get 1 prompt", sec: 300},
    ],
    instructions: `
      <h3>Four items (all Savvas). Required: A. Pick two of B/C/D.</h3>
      <ul>
        <li><strong>A.</strong> (x² − 1)(x² − x − 6) &gt; 0  [Try It 6b]<br>
          → Factor: (x−1)(x+1)(x−3)(x+2) &gt; 0.<br>
          → Zeros: −2, −1, 1, 3.  Sign chart (pos leading coef, 4 zeros).<br>
          → Solution: x &lt; −2 OR −1 &lt; x &lt; 1 OR x &gt; 3.</li>
        <li><strong>B.</strong> x³ − 9x &gt; 0  [Practice #22]<br>
          → Factor: x(x−3)(x+3) &gt; 0.  Zeros: −3, 0, 3.<br>
          → Solution: −3 &lt; x &lt; 0 OR x &gt; 3.</li>
        <li><strong>C.</strong> 0 &gt; 4x³ + 8x² − x − 2  [Practice #23]<br>
          → Factor by grouping: (4x²−1)(x+2) = (2x−1)(2x+1)(x+2) &gt; 0 … wait, inequality is 0 &gt; f → f &lt; 0.<br>
          → Zeros: −2, −½, ½.  Sign chart.<br>
          → Solution: x &lt; −2 OR −½ &lt; x &lt; ½.</li>
        <li><strong>D.</strong> 64x² &gt; −4x³ − x − 16  [Practice #24]<br>
          → Move to one side: 4x³ + 64x² + x + 16 &gt; 0.<br>
          → Factor by grouping: (4x²+1)(x+16) &gt; 0.  Since 4x²+1 &gt; 0 always, only need x + 16 &gt; 0.<br>
          → Solution: x &gt; −16.</li>
      </ul>

      <h3>Questions to ask (NEVER deliver the answer)</h3>
      <ul>
        <li>"How many intervals does your number line have?"</li>
        <li>"What's the sign of f at your test point?"</li>
        <li>"Does this zero have odd or even multiplicity — does the sign change here?"</li>
        <li>"Strict inequality — are zeros included or excluded?"</li>
      </ul>

      <div class="callout warn">
        <strong>Item A gotcha:</strong> students may stall deciding which pairs to multiply. Remind: (x²−1) = (x−1)(x+1) and (x²−x−6) = (x−3)(x+2). Both are standard factoring from Day 4-5.
      </div>

      <div class="callout">
        <strong>Fast-finisher extension (board):</strong> write a polynomial inequality whose solution is exactly (−∞, −2) ∪ (0, 5). Then verify it with Desmos.
      </div>
    `,
    transition: `"Pencils up. Synthesis + self-rating. 4 minutes."`
  },

  {
    title: "Share / Summary — synthesis + self-rating",
    framework: "Share/Summary",
    dok: "DOK 2",
    duration: 4 * 60,
    substeps: [
      {label: "Essential Question callback", sec: 45},
      {label: "Language Objective check — call on 2", sec: 30},
      {label: "Self-rating circle (scan as they write)", sec: 60},
      {label: "One-sentence synthesis written", sec: 45},
      {label: "Preview Day 7 (Venetta DOK-3)", sec: 30},
      {label: "Transition to Exit", sec: 30},
    ],
    instructions: `
      <h3>Teacher script (4 min flat)</h3>
      <ol>
        <li><strong>Essential Question</strong> callback: "How do the zeros divide the number line, and how does that let you solve any polynomial inequality?"</li>
        <li><strong>Language Objective check:</strong> "Who used <em>the zeros are ___, so the sign changes at ___, and the solution is ___</em>?" Call on two students.</li>
        <li>Self-rating circle on packet (60s). Scan yourself as packets tilt up.</li>
        <li>One-sentence synthesis (45s): "Write in the blank — The key idea today was ___."</li>
        <li>Preview Day 7 (30s): "Next class — synthesis day + Savvas Performance Task #30 (Venetta deli profit, DOK 3)."</li>
        <li>Transition (30s): "Exit ticket. LQ Q3. 5 minutes."</li>
      </ol>

      <h3>Question to ask</h3>
      <p>"Which criterion is <em>partly</em>? What's the specific blocker?" (2 students max)</p>
    `,
    transition: `"Pencils up. Exit ticket. 5 minutes. Summary recap — no notes, no Desmos."`
  },

  {
    title: "Exit Ticket — Summary Recap",
    framework: "Exit Ticket",
    dok: "DOK 1–2",
    duration: 5 * 60,
    instructions: `
      <h3>Student task — fill-in + one sentence</h3>
      <p>Students fill in three blanks to recap today's learning, then write one sentence.</p>
      <ol>
        <li>Zeros of a polynomial split the number line into <strong>___________</strong> where the sign <strong>_______________________________________</strong>.</li>
        <li>On a sign chart, I test one point per <strong>___________________</strong> to determine whether the inequality is satisfied.</li>
        <li>The solution to a polynomial inequality is a(n) <strong>___________________</strong> of intervals where the sign is correct.</li>
        <li>One sentence: "The biggest thing I learned today is ___."</li>
      </ol>

      <div class="callout answer">
        <strong>Answer key:</strong><br>
        1. "intervals" / "can only change at a zero of odd multiplicity"<br>
        2. "interval"<br>
        3. "union" (accept "collection")<br>
        4. Open response — scan for vocabulary: zeros, sign chart, intervals, inequality.
      </div>

      <div class="callout warn">
        <strong>NOT a CER. NOT Savvas LQ Q3.</strong>
        This is a summary recap. LQ Q3 is reserved for Day 8 quiz.
        Monitor student sentences — scan for misconceptions.
        Flag students who write only "we did sign charts" (no vocabulary) → target Day 7 Launch.
      </div>

      <h3>Teacher moves during write time</h3>
      <ul>
        <li>No questions asked. Circulate silently.</li>
        <li>At door: "Biggest thing — one word. Go."</li>
        <li>Skim criterion 2 self-ratings for Day 7 seating.</li>
      </ul>
    `,
    transition: `"Packets to the front. Pack up. See you next class."`
  },
];

const TRANSITION_WINDOW = 60;

const $ = id => document.getElementById(id);
const state = {
  idx: 0,
  remaining: PHASES[0].duration,
  running: false,
  lastTick: null,
  rafId: null,
  mode: "fishing",
};

function setMode(m) {
  state.mode = m;
  const f = $("mode-fishing"), r = $("mode-racing"), note = $("mode-note");
  if (f && r && note) {
    f.classList.toggle("on", m === "fishing");
    r.classList.toggle("on", m === "racing");
    note.textContent = m === "fishing"
      ? "First time this week — Fishing Frenzy keeps energy playful."
      : "Repeat day — Racing is more rigorous; use when students need the faster pace.";
  }
}
window.setMode = setMode;

function fmt(s) {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return `${m}:${ss.toString().padStart(2, '0')}`;
}

function hueForRemaining(remaining, duration) {
  const frac = Math.max(0, Math.min(1, remaining / duration));
  return Math.round(210 * frac);
}

function renderDots() {
  const dots = $("dots");
  dots.innerHTML = "";
  for (let i = 0; i < PHASES.length; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < state.idx ? " done" : i === state.idx ? " current" : "");
    dots.appendChild(d);
  }
}

function currentSubstep(phase, remaining) {
  if (!phase.substeps || !phase.substeps.length) return null;
  const elapsed = phase.duration - remaining;
  let acc = 0;
  for (let i = 0; i < phase.substeps.length; i++) {
    acc += phase.substeps[i].sec;
    if (elapsed < acc) {
      return {index: i, remainingInStep: acc - elapsed};
    }
  }
  return {index: phase.substeps.length - 1, remainingInStep: 0};
}

function renderSubsteps() {
  const p = PHASES[state.idx];
  const list = $("substep-list");
  list.innerHTML = "";
  if (!p.substeps) return;
  const cur = currentSubstep(p, state.remaining);
  p.substeps.forEach((s, i) => {
    const div = document.createElement("div");
    let cls = "substep";
    if (cur && i < cur.index) cls += " done";
    else if (cur && i === cur.index) cls += " current";
    div.className = cls;
    const text = document.createElement("div");
    text.className = "substep-text";
    text.textContent = s.label;
    const time = document.createElement("div");
    time.className = "substep-time";
    if (cur && i === cur.index) {
      time.textContent = fmt(cur.remainingInStep);
    } else {
      time.textContent = fmt(s.sec);
    }
    div.appendChild(text);
    div.appendChild(time);
    list.appendChild(div);
  });
}

function renderPhase() {
  const p = PHASES[state.idx];
  $("phase-meta").textContent = `Phase ${state.idx + 1} of ${PHASES.length}  ·  Algebra 2  ·  Lesson 3-5  ·  Combined Day 6 (Savvas-only)`;
  $("phase-title").innerHTML =
    `${p.title}<span class="badge-row">` +
    `<span class="badge framework">${p.framework}</span>` +
    (p.dok === "—" ? `` : `<span class="badge">${p.dok}</span>`) +
    `<span class="badge" style="background:#555">${Math.round(p.duration/60)} min</span>` +
    `</span>`;
  $("instructions").innerHTML = p.instructions;
  $("transition-text").textContent = p.transition || "";
  renderDots();
  update();
  if (p.framework === "Do Now B") setMode(state.mode);
}

function update() {
  const p = PHASES[state.idx];
  const hue = hueForRemaining(state.remaining, p.duration);
  document.documentElement.style.setProperty("--hue", hue);

  const pct = 100 * (1 - state.remaining / p.duration);
  $("progress-fill").style.width = pct.toFixed(1) + "%";
  $("timer").textContent = fmt(state.remaining);

  const transitionEl = $("transition");
  if (state.remaining <= TRANSITION_WINDOW && state.remaining > 0) {
    transitionEl.classList.add("active");
  } else {
    transitionEl.classList.remove("active");
  }

  renderSubsteps();

  $("btn-prev").disabled = state.idx === 0;
  $("btn-play").textContent = state.running ? "⏸ Pause" : (state.remaining === PHASES[state.idx].duration ? "▶ Start" : "▶ Resume");
  $("status-line").textContent = state.running ? "Running" : (state.remaining === 0 ? "Phase complete" : "Paused");
}

function tick(ts) {
  if (!state.running) return;
  if (state.lastTick === null) state.lastTick = ts;
  const dt = (ts - state.lastTick) / 1000;
  state.lastTick = ts;
  state.remaining -= dt;
  if (state.remaining <= 0) {
    state.remaining = 0;
    state.running = false;
    update();
    return;
  }
  update();
  state.rafId = requestAnimationFrame(tick);
}

function play() {
  if (state.remaining <= 0) return;
  state.running = true;
  state.lastTick = null;
  cancelAnimationFrame(state.rafId);
  state.rafId = requestAnimationFrame(tick);
  update();
}
function pause() {
  state.running = false;
  cancelAnimationFrame(state.rafId);
  update();
}
function toggle() { state.running ? pause() : play(); }

function next() {
  if (state.idx < PHASES.length - 1) {
    state.idx++;
    state.remaining = PHASES[state.idx].duration;
    state.running = false;
    cancelAnimationFrame(state.rafId);
    renderPhase();
  }
}
function prev() {
  if (state.idx > 0) {
    state.idx--;
    state.remaining = PHASES[state.idx].duration;
    state.running = false;
    cancelAnimationFrame(state.rafId);
    renderPhase();
  }
}
function resetPhase() {
  state.remaining = PHASES[state.idx].duration;
  state.running = false;
  cancelAnimationFrame(state.rafId);
  update();
}
function restartAll() {
  state.idx = 0;
  state.remaining = PHASES[0].duration;
  state.running = false;
  cancelAnimationFrame(state.rafId);
  renderPhase();
}

$("btn-play").addEventListener("click", toggle);
$("btn-next").addEventListener("click", next);
$("btn-prev").addEventListener("click", prev);
$("btn-reset").addEventListener("click", resetPhase);
$("btn-restart-all").addEventListener("click", restartAll);

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.code === "ArrowRight") { e.preventDefault(); next(); }
  else if (e.code === "ArrowLeft") { e.preventDefault(); prev(); }
  else if (e.key === "r" || e.key === "R") { e.preventDefault(); resetPhase(); }
});

renderPhase();
</script>
</body>
</html>
